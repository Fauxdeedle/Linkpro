<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful — LINK Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site-nav.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--charcoal:#1A1A1A;--cream:#F5F0EB;--gold:#C4A265;--muted:#8A8A8A;--serif:'Playfair Display',Georgia,serif;--sans:'Inter',sans-serif}
body{font-family:var(--sans);background:var(--cream);color:var(--charcoal);min-height:100vh;display:grid;place-items:center;padding:6rem 2rem 2rem}
.card{max-width:520px;width:100%;background:#fff;padding:3rem 2.5rem;border:1px solid rgba(0,0,0,.06);text-align:center}
.icon{width:56px;height:56px;margin:0 auto 1.5rem;border-radius:50%;background:rgba(196,162,101,.15);display:grid;place-items:center;color:var(--gold);font-size:1.5rem}
h1{font-family:var(--serif);font-size:2rem;font-weight:500;margin-bottom:.75rem}
p{color:rgba(26,26,26,.6);line-height:1.7;margin-bottom:1.5rem}
.status{font-size:.85rem;color:var(--muted);margin-bottom:2rem}
.card a{display:inline-block;padding:14px 28px;background:var(--charcoal);color:#fff;font-size:.7rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;transition:background .3s}
.card a:hover{background:var(--gold);color:var(--charcoal)}
.card a.secondary{display:block;margin-top:1rem;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body class="nav-surface-light">
<!-- LINKPRO_NAV_START -->
<!-- LINK Pro site nav — edit this file, then run: npm run build:nav -->
<nav class="nav" id="nav">
  <div class="nav__inner">
    <a href="/" class="nav__logo">
      <div class="nav__logo-icon">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M20 2L38 35H2L20 2Z" stroke="#C4A265" stroke-width="1.5" fill="none"/>
          <path d="M20 10L31 31H9L20 10Z" stroke="#C4A265" stroke-width="0.8" fill="none" opacity="0.5"/>
          <line x1="20" y1="2" x2="20" y2="35" stroke="#C4A265" stroke-width="0.5" opacity="0.3"/>
        </svg>
      </div>
      LINK Pro
    </a>
    <div class="nav__links">
      <a href="/about" data-nav-id="about">About</a>
      <a href="/services" data-nav-id="services">Services</a>
      <a href="/classes" data-nav-id="classes">Classes</a>
      <a href="/peak-athleticism" data-nav-id="peak">Peak</a>
      <a href="/courses" data-nav-id="courses">Courses</a>
      <a href="/blog" data-nav-id="blog">Blog</a>
      <a href="/reviews" data-nav-id="reviews">Reviews</a>
      <a href="/#contact" class="nav__cta">Book Now</a>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu" type="button">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="mobile-nav" id="mobileNav" aria-hidden="true">
  <a href="/about" class="mobile-nav__link" data-nav-id="about">About</a>
  <a href="/services" class="mobile-nav__link" data-nav-id="services">Services</a>
  <a href="/classes" class="mobile-nav__link" data-nav-id="classes">Classes</a>
  <a href="/peak-athleticism" class="mobile-nav__link" data-nav-id="peak">Peak</a>
  <a href="/courses" class="mobile-nav__link" data-nav-id="courses">Courses</a>
  <a href="/blog" class="mobile-nav__link" data-nav-id="blog">Blog</a>
  <a href="/reviews" class="mobile-nav__link" data-nav-id="reviews">Reviews</a>
  <a href="/#contact" class="mobile-nav__link">Contact</a>
  <a href="/#contact" class="mobile-nav__cta">Book a Consultation</a>
</div>
<!-- LINKPRO_NAV_END -->

<div class="card">
  <div class="icon">✓</div>
  <h1>Thank you!</h1>
  <p id="message">Your payment was successful. You’re all set to start learning.</p>
  <p class="status" id="status">Verifying payment…</p>
  <a id="continue-link" href="courses.html" style="display:none">Continue to course</a>
  <a class="secondary" href="courses.html">Back to courses</a>
</div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var sessionId = params.get('session_id');
  var statusEl = document.getElementById('status');
  var messageEl = document.getElementById('message');
  var linkEl = document.getElementById('continue-link');

  if (!sessionId) {
    statusEl.textContent = 'No session found. If you completed payment, check your email for confirmation.';
    return;
  }

  fetch('/api/checkout-session/' + encodeURIComponent(sessionId))
    .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
    .then(function (result) {
      if (!result.ok || result.data.status !== 'paid') {
        statusEl.textContent = result.data.error || 'Payment could not be verified.';
        return;
      }

      statusEl.textContent = result.data.productName ? 'Enrolled in ' + result.data.productName : 'Payment verified';
      messageEl.textContent = 'Your enrollment is confirmed. Access your course whenever you’re ready.';
      linkEl.href = result.data.successUrl || 'courses.html';
      linkEl.style.display = 'inline-block';
    })
    .catch(function () {
      statusEl.textContent = 'Could not verify payment. Contact support if you were charged.';
    });
})();
</script>
<script src="/js/site-nav.js" defer></script>
</body>
</html>
