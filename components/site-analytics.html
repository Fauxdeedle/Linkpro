<!-- Vercel Web Analytics for the linkpro project. The script is served at /_vercel/insights/* after Web Analytics is enabled. -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  window.va('beforeSend', function (event) {
    try {
      var url = new URL(event.url);
      if (!url.searchParams.has('session_id')) return event;
      url.searchParams.delete('session_id');
      return Object.assign({}, event, { url: url.toString() });
    } catch (err) {
      return event;
    }
  });
</script>
<script defer src="/_vercel/insights/script.js"></script>
