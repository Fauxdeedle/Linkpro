<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — LINK Pro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      background: #f5f0eb;
      color: #1a1a1a;
      font-family: Inter, system-ui, sans-serif;
    }
    main {
      width: min(100%, 560px);
      padding: 2rem;
      background: #fff;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 0.5rem; font: 500 2rem Georgia, serif; }
    .product { margin: 0 0 1.75rem; color: #666; }
    label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 0.85rem 0.9rem;
      border: 1px solid rgba(0, 0, 0, 0.16);
      font: inherit;
    }
    .hint { margin: 0.75rem 0 0; color: #666; font-size: 0.92rem; line-height: 1.5; }
    button {
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.9rem 1.25rem;
      border: 0;
      background: #1a1a1a;
      color: #fff;
      font: 600 0.85rem Inter, system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    button:disabled { cursor: wait; opacity: 0.55; }
    .message { margin: 1rem 0 0; line-height: 1.5; }
    .error { color: #a52626; }
    .back { display: inline-block; margin-top: 1.25rem; color: #555; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Secure checkout</h1>
    <p id="product-name" class="product">Enter the email that should keep access to this purchase.</p>
    <form id="checkout-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <p class="hint">Online courses unlock again later for this same email.</p>
      <button id="pay-button" type="submit">Continue to payment</button>
    </form>
    <p id="checkout-message" class="message" role="status" aria-live="polite" hidden></p>
    <button id="retry-button" type="button" hidden>Try again</button>
    <a class="back" href="/courses.html">Back to courses</a>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get('product');
    const productName = document.getElementById('product-name');
    const message = document.getElementById('checkout-message');
    const retryButton = document.getElementById('retry-button');
    const form = document.getElementById('checkout-form');
    const payButton = document.getElementById('pay-button');
    const emailInput = document.getElementById('email');

    function showError(text) {
      message.hidden = false;
      message.textContent = text;
      message.classList.add('error');
      form.hidden = false;
      retryButton.hidden = true;
    }

    async function createSession(event) {
      event.preventDefault();
      payButton.disabled = true;
      message.hidden = false;
      message.textContent = 'Redirecting you to Flute’s secure hosted checkout…';
      message.classList.remove('error');

      const response = await fetch('/api/create-checkout-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          productId,
          customerEmail: emailInput.value,
        }),
      });
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || 'Could not create a payment session.');
      }

      const checkoutUrl = new URL(data.checkoutUrl);
      if (checkoutUrl.protocol !== 'https:') {
        throw new Error('Flute returned an invalid checkout URL.');
      }

      productName.textContent = data.productName;
      window.location.replace(checkoutUrl.href);
    }

    form.addEventListener('submit', async function (event) {
      if (!productId) {
        event.preventDefault();
        productName.textContent = 'No product selected';
        showError('Choose a product before starting checkout.');
        return;
      }

      try {
        await createSession(event);
      } catch (error) {
        productName.textContent = 'Checkout unavailable';
        showError(error.message || 'Could not initialize checkout.');
      } finally {
        payButton.disabled = false;
      }
    });
  </script>

<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  window.va('beforeSend', function (event) {
    try {
      var url = new URL(event.url);
      if (!url.searchParams.has('session_id')) return event;
      url.searchParams.delete('session_id');
      return Object.assign({}, event, { url: url.toString() });
    } catch (err) {
      return event;
    }
  });
</script>
<script defer src="/_vercel/insights/script.js"></script>
<!-- LINKPRO_ANALYTICS_END -->
</body>
</html>
