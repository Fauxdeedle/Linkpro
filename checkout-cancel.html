<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout Cancelled — LINK Pro</title>
<link rel="stylesheet" href="/css/site-fonts.css">
<link rel="stylesheet" href="/css/site-nav.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--charcoal:#1A1A1A;--cream:#F5F0EB;--gold:#C4A265;--muted:#8A8A8A;--serif:var(--font-display);--sans:'Inter',sans-serif}
body{font-family:var(--sans);background:var(--cream);color:var(--charcoal);min-height:100vh;display:grid;place-items:center;padding:6rem 2rem 2rem}
.card{max-width:520px;width:100%;background:#fff;padding:3rem 2.5rem;border:1px solid rgba(0,0,0,.06);text-align:center}
h1{font-family:var(--serif);font-size:2rem;font-weight:700;margin-bottom:.75rem}
p{color:rgba(26,26,26,.6);line-height:1.7;margin-bottom:2rem}
.card a{display:inline-block;padding:14px 28px;background:var(--charcoal);color:#fff;font-size:.7rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;transition:background .3s;margin:0 .5rem .5rem 0}
.card a:hover{background:var(--gold);color:var(--charcoal)}
.card a.secondary{background:transparent;color:var(--charcoal);border:1px solid rgba(26,26,26,.2)}
.card a.secondary:hover{background:var(--charcoal);color:#fff}
</style>
</head>
<body class="nav-surface-light">
<!-- LINKPRO_NAV_START -->
<!-- LINK Pro site nav — edit this file, then run: npm run build:nav -->
<nav class="nav" id="nav">
  <div class="nav__inner">
    <a href="/" class="nav__logo" aria-label="LINK Pro home">
      <img
        src="/assets/brand/link-site-logo-light.svg"
        alt=""
        width="158"
        height="35"
        class="nav__logo-lockup"
        decoding="async"
      />
    </a>
    <div class="nav__links">
      <a href="/about" data-nav-id="about">About</a>
      <a href="/services" data-nav-id="services">Services</a>
      <a href="/classes" data-nav-id="classes">Classes</a>
      <a href="/peak-athleticism" data-nav-id="peak">Peak</a>
      <a href="/courses" data-nav-id="courses">Courses</a>
      <a href="/blog" data-nav-id="blog">Blog</a>
      <a href="/reviews" data-nav-id="reviews">Reviews</a>
      <a href="/#contact" class="nav__cta">Book Now</a>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu" type="button">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="mobile-nav" id="mobileNav" aria-hidden="true">
  <a href="/about" class="mobile-nav__link" data-nav-id="about">About</a>
  <a href="/services" class="mobile-nav__link" data-nav-id="services">Services</a>
  <a href="/classes" class="mobile-nav__link" data-nav-id="classes">Classes</a>
  <a href="/peak-athleticism" class="mobile-nav__link" data-nav-id="peak">Peak</a>
  <a href="/courses" class="mobile-nav__link" data-nav-id="courses">Courses</a>
  <a href="/blog" class="mobile-nav__link" data-nav-id="blog">Blog</a>
  <a href="/reviews" class="mobile-nav__link" data-nav-id="reviews">Reviews</a>
  <a href="/#contact" class="mobile-nav__link">Contact</a>
  <a href="/#contact" class="mobile-nav__cta">Book a Consultation</a>
</div>
<!-- LINKPRO_NAV_END -->

<div class="card">
  <h1>Checkout cancelled</h1>
  <p>No charge was made. You can return to courses and try again whenever you’re ready.</p>
  <a href="courses.html">Back to courses</a>
  <a class="secondary" id="retry-link" href="courses.html">Try again</a>
</div>
<script>
(function () {
  var product = new URLSearchParams(window.location.search).get('product');
  if (product) {
    document.getElementById('retry-link').href = 'courses.html#' + (product === 'seminar-upper-limb' ? 'seminars' : 'online');
  }
})();
</script>
<script src="/js/site-nav.js" defer></script>
</body>
</html>
