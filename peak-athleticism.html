<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peak Athleticism — Young Athlete Reconditioning | LINK Pro</title>
<meta name="description" content="Peak Athleticism by LINK Pro reconditions young athletes with breath, brain, and movement mastery.">

<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --peak-black: #050505;
  --peak-charcoal: #121212;
  --peak-panel: #1a1816;
  --peak-bronze: #9a8264;
  --peak-bronze-bright: #b89972;
  --peak-bronze-dim: #6b5a45;
  --peak-text: rgba(255, 255, 255, 0.88);
  --peak-muted: rgba(255, 255, 255, 0.52);
  --peak-display: var(--font-display);
  --peak-sans: 'Archivo', system-ui, sans-serif;
  --peak-side: clamp(20px, 5vw, 64px);
  --peak-max: 1080px;
  --peak-ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--peak-sans);
  color: var(--peak-text);
  background: var(--peak-black);
  -webkit-font-smoothing: antialiased;
  line-height: 1.65;
}

a { text-decoration: none; color: inherit; }

.peak-hero {
  position: relative;
  min-height: min(92vh, 880px);
  display: flex;
  align-items: flex-end;
  padding: 140px var(--peak-side) clamp(48px, 8vw, 88px);
  overflow: hidden;
}

.peak-hero__bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 70% 20%, rgba(154, 130, 100, 0.12) 0%, transparent 55%),
    linear-gradient(180deg, #0a0a0a 0%, var(--peak-black) 55%, #080808 100%);
  z-index: 0;
}

.peak-hero__bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(
    -14deg,
    transparent,
    transparent 56px,
    rgba(154, 130, 100, 0.03) 56px,
    rgba(154, 130, 100, 0.03) 57px
  );
  opacity: 0.7;
}

.peak-hero__inner {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: var(--peak-max);
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(200px, 320px);
  gap: clamp(32px, 6vw, 72px);
  align-items: end;
}

.peak-hero__eyebrow {
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--peak-bronze-bright);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.peak-hero__eyebrow::before {
  content: '';
  width: 36px;
  height: 1px;
  background: var(--peak-bronze-dim);
}

.peak-hero__title {
  font-family: var(--peak-display);
  font-size: clamp(3rem, 8vw, 5.5rem);
  font-weight: 400;
  line-height: 0.95;
  letter-spacing: 0.02em;
  color: #fff;
  margin-bottom: 20px;
  text-transform: uppercase;
}

.peak-hero__sub {
  font-size: clamp(0.95rem, 1.8vw, 1.08rem);
  font-weight: 400;
  color: var(--peak-muted);
  max-width: 36em;
  line-height: 1.75;
}

.peak-hero__logo-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  max-width: min(320px, 42vw);
  margin-left: auto;
}

.peak-hero__logo-wrap img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
}

.peak-container {
  max-width: var(--peak-max);
  margin: 0 auto;
  padding: 0 var(--peak-side);
}

.peak-section {
  padding: clamp(64px, 10vw, 96px) 0;
  background: var(--peak-black);
}

.peak-section--dark {
  background: var(--peak-charcoal);
  border-top: 1px solid rgba(154, 130, 100, 0.12);
  border-bottom: 1px solid rgba(154, 130, 100, 0.12);
}

.peak-h2 {
  font-family: var(--peak-display);
  font-size: clamp(2rem, 4.5vw, 3rem);
  font-weight: 400;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #fff;
  margin-bottom: 32px;
  line-height: 1.05;
}

.peak-h2 em {
  font-style: normal;
  color: var(--peak-bronze-bright);
}

.peak-h3 {
  font-family: var(--peak-display);
  font-size: 1.35rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--peak-bronze-bright);
  margin-bottom: 12px;
}

.peak-lead {
  font-size: clamp(1.15rem, 2.2vw, 1.45rem);
  font-weight: 500;
  color: #fff;
  margin-bottom: 24px;
  line-height: 1.5;
}

.peak-p {
  font-size: 0.95rem;
  color: var(--peak-muted);
  margin-bottom: 16px;
  max-width: 42em;
  line-height: 1.8;
}

.peak-list {
  list-style: none;
  margin: 8px 0 20px;
}

.peak-list li {
  position: relative;
  padding: 10px 0 10px 22px;
  font-size: 0.92rem;
  color: var(--peak-muted);
  line-height: 1.7;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.peak-list li:last-child { border-bottom: none; }

.peak-list li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 1.15em;
  width: 6px;
  height: 6px;
  background: var(--peak-bronze);
  transform: rotate(45deg);
}

.peak-pillars {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(20px, 3vw, 32px);
}

.peak-pillar {
  background: var(--peak-panel);
  border: 1px solid rgba(154, 130, 100, 0.2);
  padding: clamp(24px, 3vw, 36px);
}

.peak-split {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: clamp(32px, 5vw, 56px);
  align-items: start;
}

.peak-callout {
  background: var(--peak-panel);
  border-left: 3px solid var(--peak-bronze);
  padding: 32px 28px;
}

.peak-label {
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--peak-bronze);
  margin-bottom: 12px;
}

.peak-topics {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.peak-topic {
  background: var(--peak-panel);
  border: 1px solid rgba(154, 130, 100, 0.15);
}

.peak-topic__summary {
  cursor: pointer;
  padding: 20px 24px;
  font-family: var(--peak-display);
  font-size: 1.15rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: #fff;
  list-style: none;
}

.peak-topic__summary::-webkit-details-marker { display: none; }

.peak-topic__summary::after {
  content: '+';
  float: right;
  color: var(--peak-bronze-bright);
  font-family: var(--peak-sans);
  font-weight: 300;
}

.peak-topic[open] .peak-topic__summary::after { content: '−'; }

.peak-topic__body {
  padding: 0 24px 20px;
}

.peak-quotes {
  background: var(--peak-charcoal);
}

.peak-quote {
  font-family: var(--peak-display);
  font-size: clamp(1.4rem, 3vw, 2rem);
  letter-spacing: 0.03em;
  line-height: 1.35;
  color: rgba(255, 255, 255, 0.75);
  border-left: 3px solid var(--peak-bronze);
  padding-left: 24px;
  margin: 24px 0;
  max-width: 40em;
}

.peak-cta {
  padding: clamp(72px, 12vw, 112px) 0;
  background:
    linear-gradient(135deg, rgba(154, 130, 100, 0.15) 0%, transparent 50%),
    var(--peak-black);
  text-align: center;
}

.peak-cta__title {
  font-family: var(--peak-display);
  font-size: clamp(2rem, 5vw, 3.2rem);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #fff;
  margin-bottom: 12px;
}

.peak-cta__body {
  color: var(--peak-muted);
  margin-bottom: 28px;
  font-size: 1rem;
}

.peak-btn {
  display: inline-block;
  padding: 16px 40px;
  background: var(--peak-bronze);
  color: var(--peak-black);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  transition: transform 0.35s var(--peak-ease), background 0.35s;
}

.peak-btn:hover {
  background: var(--peak-bronze-bright);
  transform: translateY(-2px);
}

.peak-footer {
  background: #000;
  border-top: 1px solid rgba(154, 130, 100, 0.15);
  padding: 48px var(--peak-side) 28px;
}

.peak-footer__inner {
  max-width: var(--peak-max);
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

.peak-footer__logo {
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.peak-footer__logo span { color: var(--peak-bronze); }

.peak-footer p {
  font-size: 0.75rem;
  color: rgba(255, 255, 255, 0.35);
}

.peak-footer__links {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}

.peak-footer__links a {
  font-size: 0.7rem;
  color: rgba(255, 255, 255, 0.4);
  transition: color 0.3s;
}

.peak-footer__links a:hover { color: var(--peak-bronze-bright); }

.peak-content-note {
  text-align: center;
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.25);
  padding: 16px var(--peak-side) 32px;
}

.reveal {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.75s var(--peak-ease), transform 0.75s var(--peak-ease);
}

.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

@media (max-width: 900px) {
  .peak-hero__inner { grid-template-columns: 1fr; }
  .peak-hero__logo-wrap { margin: 0; max-width: min(240px, 55vw); }
  .peak-pillars { grid-template-columns: 1fr; }
  .peak-split { grid-template-columns: 1fr; }
}
</style>
</head>
